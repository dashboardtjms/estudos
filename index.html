// ======================= FUNÇÕES SUPABASE =======================
async function fetchUserProgress(userId) {
    const { data, error } = await supabaseClient.from('user_progress').select('*').eq('user_id', userId);
    if (error) throw error;
    const map = getEmptyProgressMap();
    if (data) {
        data.forEach(row => {
            map[row.topic_id] = {
                status: row.status,
                questoes_respondidas: row.questoes_respondidas || 0,
                questoes_acertos: row.questoes_acertos || 0,
                ultima_revisao: row.ultima_revisao,
                proxima_revisao: row.proxima_revisao,
                revisoes: row.revisoes || [],
                nivel_conhecimento: row.nivel_conhecimento || 0
            };
        });
    }
    return map;
}

async function fetchWeekLogs(userId) {
    const { data, error } = await supabaseClient.from('week_logs').select('log_date, hours').eq('user_id', userId);
    if (error) throw error;
    const logs = {};
    if (data) data.forEach(l => { logs[l.log_date] = l.hours; });
    return logs;
}

async function upsertTopicProgress(userId, topicId, data) {
    const { error } = await supabaseClient.from('user_progress').upsert({
        user_id: userId,
        topic_id: topicId,
        status: data.status,
        questoes_respondidas: data.questoes_respondidas,
        questoes_acertos: data.questoes_acertos,
        ultima_revisao: data.ultima_revisao,
        proxima_revisao: data.proxima_revisao,
        revisoes: data.revisoes,
        nivel_conhecimento: data.nivel_conhecimento
    }, { onConflict: 'user_id, topic_id' });
    if (error) throw error;
}

async function upsertWeekHour(userId, date, hours) {
    const { error } = await supabaseClient.from('week_logs').upsert({
        user_id: userId,
        log_date: date,
        hours: hours
    }, { onConflict: 'user_id, log_date' });
    if (error) throw error;
}
