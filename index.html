// ─── UUID PERSISTENTE (sem necessidade de auth) ───────────────────────────────
// Gera e persiste um UUID único no localStorage para identificar o usuário.
// Isso garante que os dados sejam sempre associados ao mesmo "usuário" neste browser.
function getOrCreateUserId() {
  const KEY = 'tjms_user_id';
  let uid = localStorage.getItem(KEY);
  if (!uid) {
    // Gera UUID v4
    uid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
    localStorage.setItem(KEY, uid);
  }
  return uid;
}

// ─── SUPABASE HELPERS ─────────────────────────────────────────────────────────
const saveTimers = {};

async function saveTopic(userId, topic_id, data) {
  if (!userId) { console.warn('saveTopic: userId nulo, abortando'); return; }
  clearTimeout(saveTimers[topic_id]);
  saveTimers[topic_id] = setTimeout(async () => {
    const row = {
      user_id: userId,
      topic_id: Number(topic_id),
      status: data.status,
      questoes_respondidas: data.questoes_respondidas || 0,
      questoes_acertos: data.questoes_acertos || 0,
      ultima_revisao: data.ultima_revisao || null,
      proxima_revisao: data.proxima_revisao || null,
      revisoes: data.revisoes || [],
      nivel_conhecimento: data.nivel_conhecimento || 0,
      updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from('user_progress').upsert(row, { onConflict: 'user_id,topic_id' });
    if (error) console.error('Erro ao salvar tópico', topic_id, error.message, error);
    else console.log('✓ Tópico salvo:', topic_id);
  }, 600);
}

async function saveWeekLog(userId, log_date, hours) {
  if (!userId) { console.warn('saveWeekLog: userId nulo, abortando'); return; }
  const { error } = await sb.from('week_logs')
    .upsert({ user_id: userId, log_date, hours: parseFloat(hours) || 0 }, { onConflict: 'user_id,log_date' });
  if (error) console.error('Erro ao salvar horas', error.message, error);
  else console.log('✓ Horas salvas:', log_date, hours);
}

  // Inicialização: obtém ID persistente do localStorage + carrega dados do Supabase
  useEffect(() => {
    (async () => {
      try {
        // Obtém (ou cria) o UUID persistente deste browser — sem necessidade de auth
        const uid = getOrCreateUserId();
        userIdRef.current = uid;
        setUserId(uid);
        console.log('User ID:', uid);

        // Carrega progresso de tópicos
        const { data: prog, error: pe } = await sb
          .from('user_progress').select('*').eq('user_id', uid);
        if (pe) {
          console.error('Erro ao carregar progresso:', pe.message, pe);
        } else if (prog && prog.length > 0) {
          const base = getInit();
          prog.forEach(r => {
            base[r.topic_id] = {
              status: r.status || 'nao_iniciado',
              questoes_respondidas: r.questoes_respondidas || 0,
              questoes_acertos: r.questoes_acertos || 0,
              ultima_revisao: r.ultima_revisao || null,
              proxima_revisao: r.proxima_revisao || null,
              revisoes: r.revisoes || [],
              nivel_conhecimento: r.nivel_conhecimento || 0,
            };
          });
          setTd(base);
          console.log('✓ Progresso carregado:', prog.length, 'tópicos');
        }

        // Carrega horas da semana
        const { data: wl, error: we } = await sb
          .from('week_logs').select('*').eq('user_id', uid);
        if (we) {
          console.error('Erro ao carregar horas:', we.message, we);
        } else if (wl && wl.length > 0) {
          const obj = {};
          wl.forEach(r => { obj[r.log_date] = Number(r.hours || 0); });
          setWeekLog(obj);
          console.log('✓ Horas carregadas:', wl.length, 'registros');
        }
      } catch (err) {
        console.error('Erro na inicialização:', err.message || err);
      } finally {
        document.getElementById('loading').style.display = 'none';
        setReady(true);
      }
    })();
  }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  // Atualiza tópico localmente e persiste no Supabase
  const updT = (tid, upd) => {
    setTd(prev => {
      const next = { ...prev, [tid]: { ...prev[tid], ...upd } };
      saveTopic(userIdRef.current, tid, next[tid]);
      return next;
    });
  };

  const setStatus = (tid, status) => {
    const upd = { status };
    if (status === "concluido") {
      const niv = td[tid]?.nivel_conhecimento || 0;
      const days = niv >= 3 ? 30 : niv >= 2 ? 15 : 7;
      const today = todayStr();
      upd.ultima_revisao = today;
      upd.proxima_revisao = addDays(today, days);
    }
    updT(tid, upd);
    showToast("Status atualizado");
  };

  const markRev = (tid) => {
    const today = todayStr();
    const t = td[tid];
    const niv = t?.nivel_conhecimento || 0;
    const days = niv >= 3 ? 30 : niv >= 2 ? 15 : 7;
    const revs = [...(t?.revisoes || []), today];
    updT(tid, { ultima_revisao: today, proxima_revisao: addDays(today, days), revisoes: revs });
    showToast("Revisão registrada!");
  };

  const saveModal = (tid, form) => {
    const niv = form.questoes_respondidas >= 100
      ? (form.questoes_acertos / form.questoes_respondidas >= 0.7 ? 3
        : form.questoes_acertos / form.questoes_respondidas >= 0.5 ? 2 : 1) : 0;
    const today = todayStr();
    let prox = td[tid]?.proxima_revisao;
    if (form.status === "concluido" && !prox) {
      prox = addDays(today, niv >= 3 ? 30 : niv >= 2 ? 15 : 7);
    }
    updT(tid, { ...form, nivel_conhecimento: niv, proxima_revisao: prox });
    setModal(null);
    showToast("Dados salvos!");
  };

  const logHours = async (date, h) => {
    const hours = parseFloat(h) || 0;
    setWeekLog(p => ({ ...p, [date]: hours }));
    await saveWeekLog(userIdRef.current, date, hours);
    showToast("Horas registradas!");
  };

  // ─── CÁLCULOS ──────────────────────────────────────────────────────────────
  const today = todayStr();
  const allT = DISCS.flatMap(d => d.topics.map(t => ({
    ...t, discId: d.id, discName: d.name, discColor: d.color, discPrio: d.priority
  })));
  const totalT = allT.length;
  const conc   = allT.filter(t => td[t.id]?.status === "concluido").length;
  const emAnd  = allT.filter(t => td[t.id]?.status === "em_andamento").length;
  const naoIn  = allT.filter(t => td[t.id]?.status === "nao_iniciado").length;
  const pctG   = totalT ? Math.round((conc / totalT) * 100) : 0;

  let totQ = 0, totAc = 0;
  allT.forEach(t => { const x = td[t.id]; if (x) { totQ += x.questoes_respondidas || 0; totAc += x.questoes_acertos || 0; }});
  const totErr = totQ - totAc;
  const pctAc  = totQ ? Math.round((totAc / totQ) * 100) : 0;
  const pctErr = totQ ? Math.round((totErr / totQ) * 100) : 0;

  const revVenc = allT.filter(t => {
    const x = td[t.id];
    return x?.proxima_revisao && x.proxima_revisao <= today && x.status === "concluido";
  });
  const revProx = allT.filter(t => {
    const x = td[t.id];
    if (!x?.proxima_revisao || x.status !== "concluido") return false;
    const diff = (new Date(x.proxima_revisao) - new Date(today)) / 86400000;
    return diff > 0 && diff <= 7;
  });

  const ds = DISCS.map(d => {
    const tops = d.topics;
    const c = tops.filter(t => td[t.id]?.status === "concluido").length;
    const pct = tops.length ? Math.round((c / tops.length) * 100) : 0;
    let dQ = 0, dA = 0;
    tops.forEach(t => { const x = td[t.id]; if (x) { dQ += x.questoes_respondidas || 0; dA += x.questoes_acertos || 0; }});
    const dpA = dQ ? Math.round((dA / dQ) * 100) : null;
    return { ...d, conc: c, total: tops.length, pct, questoes: dQ, acertos: dA, pctAcertos: dpA };
  });

  const critDisc = ds.filter(d => (d.priority === "muito_alta" || d.priority === "alta") && d.pct < 50);
  const critTops = allT.filter(t => {
    const x = td[t.id];
    if (!x || x.questoes_respondidas < 10) return false;
    return (x.questoes_acertos / x.questoes_respondidas) < 0.5;
  });

  const getWkDays = () => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push(d.toISOString().split("T")[0]);
    }
    return days;
  };
  const wkDays = getWkDays();
  const wkH    = wkDays.map(d => ({ date: d, hours: weekLog[d] || 0 }));
  const totWH  = wkH.reduce((s, d) => s + d.hours, 0);
  const DAYS   = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const tabs   = [{id:"dashboard",label:"Painel"},{id:"edital",label:"Edital"},
    {id:"revisoes",label:"Revisões"},{id:"questoes",label:"Questões"},{id:"graficos",label:"Gráficos"}];

  // ─── ESTILOS BASE ──────────────────────────────────────────────────────────
  const s = {
    wrap:  { fontFamily:"'Inter',system-ui,sans-serif", minHeight:"100vh", background:"#F1F5F9", color:"#111827" },
    hdr:   { background:"#1E2432", color:"white", padding:"0 20px" },
    hdrIn: { maxWidth:1060, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", height:52 },
    logo:  { display:"flex", alignItems:"center", gap:10 },
    logoBox:{ width:30, height:30, background:"#534AB7", borderRadius:7, display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, fontWeight:700, color:"white" },
    tabsBar:{ maxWidth:1060, margin:"0 auto", display:"flex", gap:2 },
    main:  { maxWidth:1060, margin:"0 auto", padding:"20px" },
    card:  { background:"white", borderRadius:12, border:"0.5px solid #E2E8F0", padding:16 },
    grid2: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 },
    grid3: { display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 },

  const E = React.createElement;

          E("input", { type:"number",min:"0",value:form.questoes_respondidas,
            onChange:e=>setForm(f=>({...f,questoes_respondidas:Math.max(0,parseInt(e.target.value)||0)})),
            style:{width:"100%",marginTop:4,border:"0.5px solid #D1D5DB",borderRadius:7,padding:"7px 9px",fontSize:12,outline:"none"} })),
        E("div", null,
          E("label", { style:{fontSize:11,color:"#6B7280",fontWeight:500} }, "Acertos"),
          E("input", { type:"number",min:"0",max:form.questoes_respondidas,value:form.questoes_acertos,
            onChange:e=>setForm(f=>({...f,questoes_acertos:Math.min(f.questoes_respondidas,Math.max(0,parseInt(e.target.value)||0))})),
            style:{width:"100%",marginTop:4,border:"0.5px solid #D1D5DB",borderRadius:7,padding:"7px 9px",fontSize:12,outline:"none"} }))),
      form.questoes_respondidas > 0 && E("div", { style:{background:"#F8FAFC",borderRadius:7,padding:10,marginBottom:14,display:"flex",gap:14} },
        E("div", { style:{textAlign:"center"} }, E("div", { style:{fontSize:10,color:"#6B7280"} }, "Acertos"), E("div", { style:{fontSize:17,fontWeight:700,color:"#10B981"} }, pA+"%")),
        E("div", { style:{textAlign:"center"} }, E("div", { style:{fontSize:10,color:"#6B7280"} }, "Erros"), E("div", { style:{fontSize:17,fontWeight:700,color:"#EF4444"} }, (100-pA)+"%")),
        E("div", { style:{textAlign:"center"} }, E("div", { style:{fontSize:10,color:"#6B7280"} }, "Meta 100q"),
          E("div", { style:{fontSize:17,fontWeight:700,color:form.questoes_respondidas>=1000?"#10B981":"#F59E0B"} }, form.questoes_respondidas>=1000?"✓":form.questoes_respondidas+"/30"))),
      E("div", { style:{marginBottom:18} },
        E("label", { style:{fontSize:11,color:"#6B7280",fontWeight:500} }, "Nível de conhecimento"),
        E("div", { style:{display:"flex",gap:6,marginTop:5} },
          [[0,"Iniciante"],[1,"Básico"],[2,"Intermediário"],[3,"Avançado"]].map(([v,l]) =>
            E("button", { key:v, onClick:()=>setForm(f=>({...f,nivel_conhecimento:v})),
              style:{flex:1,padding:"5px 0",border:`0.5px solid ${form.nivel_conhecimento===v?"#534AB7":"#D1D5DB"}`,
                borderRadius:5,fontSize:10,cursor:"pointer",fontWeight:form.nivel_conhecimento===v?600:400,
                background:form.nivel_conhecimento===v?"#EEF2FF":"white",color:form.nivel_conhecimento===v?"#534AB7":"#6B7280"} }, l))),
        E("div", { style:{fontSize:9,color:"#9CA3AF",marginTop:3} }, "Nível 0–1: rev. em 7 dias · Nível 2: 15 dias · Nível 3: 30 dias")),
      E("div", { style:{display:"flex",gap:8} },
        E("button", { onClick:onClose, style:{flex:1,padding:"9px",border:"0.5px solid #D1D5DB",borderRadius:7,fontSize:12,cursor:"pointer",background:"white",color:"#6B7280"} }, "Cancelar"),
        E("button", { onClick:()=>onSave(topic.id,form), style:{flex:2,padding:"9px",border:"none",borderRadius:7,fontSize:12,cursor:"pointer",background:"#534AB7",color:"white",fontWeight:600} }, "Salvar dados"))));
}

// ─── MOUNT ────────────────────────────────────────────────────────────────────
ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
